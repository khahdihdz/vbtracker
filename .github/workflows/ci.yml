name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check sw.js
          node --check worker/index.js
      - name: Validate required files
        run: |
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          test -s worker/schema.sql
          test -s README.md